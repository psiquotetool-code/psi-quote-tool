<style>
/* ============================================
   ADMIN PANEL STYLES
   PSI Quote Tool - Phase D
   ============================================ */

/* ============================================
   1. CSS VARIABLES
   ============================================ */

:root {
  --primary-color: #0066CC;
  --primary-dark: #004C99;
  --success-color: #28a745;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --light-bg: #f8f9fa;
  --border-color: #dee2e6;
  --text-color: #333;
  --text-muted: #6c757d;
  --tune-color: #0066CC;
  --exact-color: #007d7d;
}

/* ============================================
   2. GLOBAL RESET & BASE STYLES
   ============================================ */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-color);
  background-color: #f0f2f5;
  min-height: 100vh;
}

/* ============================================
   3. LOADING OVERLAY
   ============================================ */

.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.loading-box {
  text-align: center;
  padding: 40px;
}

.loading-spinner {
  width: 50px;
  height: 50px;
  border: 4px solid #f3f3f3;
  border-top: 4px solid var(--primary-color);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.loading-text {
  font-size: 18px;
  color: var(--text-color);
}

/* ============================================
   4. ACCESS DENIED SCREEN
   ============================================ */

.access-denied-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #f0f2f5;
  display: flex;
  justify-content: center;
  align-items: center;
}

.access-denied-box {
  background: white;
  padding: 60px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  text-align: center;
  max-width: 500px;
}

.access-denied-box h1 {
  color: var(--danger-color);
  margin-bottom: 20px;
}

.access-denied-box p {
  margin-bottom: 15px;
  color: var(--text-muted);
}

.access-denied-box .user-email {
  font-family: monospace;
  background: var(--light-bg);
  padding: 10px;
  border-radius: 4px;
  margin: 20px 0;
}

/* ============================================
   5. ADMIN PANEL LAYOUT
   ============================================ */

.admin-panel {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.admin-header {
  background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
  color: white;
  padding: 30px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.admin-header h1 {
  font-size: 28px;
  margin-bottom: 5px;
}

.admin-user {
  opacity: 0.9;
  font-size: 14px;
}

/* ============================================
   6. TAB NAVIGATION
   ============================================ */

.tab-navigation {
  display: flex;
  gap: 5px;
  margin-bottom: 20px;
  background: white;
  padding: 10px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.tab-btn {
  padding: 12px 24px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
  border-radius: 6px;
  transition: all 0.2s;
}

.tab-btn:hover {
  background: var(--light-bg);
  color: var(--text-color);
}

.tab-btn.active {
  background: var(--primary-color);
  color: white;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

/* ============================================
   7. CARDS
   ============================================ */

.card {
  background: white;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  margin-bottom: 20px;
  overflow: hidden;
}

.card-header {
  background: var(--light-bg);
  padding: 15px 20px;
  font-weight: 600;
  font-size: 16px;
  border-bottom: 1px solid var(--border-color);
}

.card-body {
  padding: 20px;
}

/* ============================================
   8. FORM ELEMENTS
   ============================================ */

.setting-group {
  margin-bottom: 25px;
}

.setting-group label {
  display: block;
  font-weight: 600;
  margin-bottom: 5px;
}

.setting-help {
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 10px;
}

.section-help {
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 20px;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

input[type="text"],
input[type="email"],
input[type="number"],
select {
  padding: 10px 12px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  font-size: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input[type="text"]:focus,
input[type="email"]:focus,
input[type="number"]:focus,
select:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
}

input[type="number"] {
  width: 100px;
}

input[type="email"] {
  width: 300px;
}

.input-suffix {
  color: var(--text-muted);
  font-size: 14px;
}

.rate-input {
  width: 120px;
  text-align: right;
  font-family: monospace;
}

.na-cell {
  color: var(--text-muted);
  font-style: italic;
}

/* ============================================
   9. BUTTONS
   ============================================ */

.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-primary {
  background: var(--primary-color);
  color: white;
}

.btn-primary:hover {
  background: var(--primary-dark);
}

.btn-secondary {
  background: var(--secondary-color);
  color: white;
}

.btn-secondary:hover {
  background: #5a6268;
}

.btn-small {
  padding: 6px 12px;
  font-size: 13px;
}

.button-row {
  margin-top: 20px;
  display: flex;
  gap: 10px;
}

/* ============================================
   10. MESSAGE BOX
   ============================================ */

.message-box {
  padding: 12px 16px;
  border-radius: 6px;
  margin-top: 15px;
  font-size: 14px;
}

.message-box.success {
  background: #d4edda;
  color: #155724;
  border: 1px solid #c3e6cb;
}

.message-box.error {
  background: #f8d7da;
  color: #721c24;
  border: 1px solid #f5c6cb;
}

/* ============================================
   11. RATE FACTOR TABLE
   ============================================ */

.rate-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 20px;
}

.rate-table th,
.rate-table td {
  padding: 12px;
  text-align: left;
  border-bottom: 1px solid var(--border-color);
}

.rate-table th {
  background: var(--light-bg);
  font-weight: 600;
}

.rate-table tr:hover {
  background: #fafafa;
}

/* ============================================
   12. QUOTE HISTORY TABLE
   ============================================ */

.filter-row {
  display: flex;
  gap: 20px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.filter-group label {
  font-weight: 500;
  white-space: nowrap;
}

.filter-group select,
.filter-group input {
  min-width: 150px;
}

.quote-count {
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 10px;
}

.table-container {
  overflow-x: auto;
}

.quote-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.quote-table th,
.quote-table td {
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border-color);
  white-space: nowrap;
}

.quote-table th {
  background: var(--light-bg);
  font-weight: 600;
  position: sticky;
  top: 0;
}

.quote-table tr:hover {
  background: #fafafa;
}

.quote-table a {
  color: var(--primary-color);
  text-decoration: none;
  font-weight: 500;
}

.quote-table a:hover {
  text-decoration: underline;
}

.no-data {
  text-align: center;
  color: var(--text-muted);
  padding: 40px !important;
  font-style: italic;
}

/* ============================================
   13. BRAND BADGES
   ============================================ */

.brand-badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
}

.brand-tune {
  background: rgba(0, 102, 204, 0.1);
  color: var(--tune-color);
}

.brand-exact {
  background: rgba(0, 125, 125, 0.1);
  color: var(--exact-color);
}

/* ============================================
   14. RESPONSIVE
   ============================================ */

@media (max-width: 768px) {
  .admin-panel {
    padding: 10px;
  }

  .admin-header {
    padding: 20px;
  }

  .admin-header h1 {
    font-size: 22px;
  }

  .tab-navigation {
    flex-wrap: wrap;
  }

  .tab-btn {
    flex: 1;
    text-align: center;
    padding: 10px;
  }

  .filter-row {
    flex-direction: column;
    gap: 10px;
  }

  .filter-group {
    width: 100%;
  }

  .filter-group select,
  .filter-group input {
    flex: 1;
  }

  .input-row {
    flex-direction: column;
    align-items: flex-start;
  }

  input[type="email"] {
    width: 100%;
  }
}
</style>
